name: Verify
on:
  pull_request:
  push:
    branches: [main, foundation]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Verify PostgreSQL schema
        env:
          PGPASSWORD: test_only
        run: |
          for file in db/migrations/*.sql db/tests/*.sql; do
            psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: npx playwright install --with-deps chromium
      - name: Verify staff API and browser lifecycle
        env:
          ADMIN_SETUP_CODE: "test-only-admin-setup-value-for-fixtures"
          TELEGRAM_BOT_TOKEN: "ci-only-token"
          COMMERCE_TEST_MODE: "1"
          DATABASE_URL: postgresql://test:test_only@127.0.0.1:5432/commerce_test
          STORE_ID: 00000000-0000-4000-8000-000000000001
          APP_ORIGIN: http://127.0.0.1:3100
          STAFF_WORKSPACE_ENABLED: "true"
          CUSTOMER_RECORDS_ENABLED: "true"
          INSTALLMENT_SCHEDULE_ENABLED: "true"
          INVESTOR_FUNDING_ENABLED: "true"
          SUPPLIER_POSTING_ENABLED: "true"
          STOCK_RECEIPTS_ENABLED: "true"
          CATALOG_ADMIN_ENABLED: "true"
          WEBSITE_CHECKOUT_ENABLED: "true"
          CATALOG_IMAGE_HOSTS: "images.example.com"
          INSTALLMENT_MIN_INITIAL_BPS: "2500"
          INSTALLMENT_MONTHLY_MARKUP_BPS: "400"
          CUSTOMER_DATA_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/commerce-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/commerce-server.log' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          node --test tests/staff-api.integration.mjs
          node --test tests/investor-allocation.integration.mjs
          node --test tests/checkout.integration.mjs
          node --test tests/website-order.integration.mjs
          node --test tests/workspace.browser.mjs
