name: Verify
on:
  pull_request:
  push:
    branches: [foundation]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --experimental-strip-types --test tests/telegram-verify.test.mjs tests/customer-crypto.test.mjs tests/installment-schedule.test.mjs tests/installment-pricing.test.mjs tests/profit-split.test.mjs
      - name: Verify PostgreSQL schema
        env:
          PGPASSWORD: test_only
        run: |
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/001_initial.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/002_telegram_replay.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/003_finance.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/004_order_workflow.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/005_manual_payments.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/006_customers.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/007_installment_posting.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/008_installment_pricing.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/009_funding.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/010_investor_access.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/migrations/011_initial_capital_returns.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/tests/constraints.sql
          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/tests/finance_constraints.sql

          psql -h localhost -U test -d commerce_test -v ON_ERROR_STOP=1 -f db/tests/order_workflow.sql
      - name: Verify staff API lifecycle
        env:
          COMMERCE_TEST_MODE: "1"
          DATABASE_URL: postgresql://test:test_only@127.0.0.1:5432/commerce_test
          STORE_ID: 00000000-0000-4000-8000-000000000001
          APP_ORIGIN: http://127.0.0.1:3100
          STAFF_WORKSPACE_ENABLED: "true"
          CUSTOMER_RECORDS_ENABLED: "true"
          INSTALLMENT_SCHEDULE_ENABLED: "true"
          INVESTOR_FUNDING_ENABLED: "true"
          INSTALLMENT_MIN_INITIAL_BPS: "2500"
          INSTALLMENT_MONTHLY_MARKUP_BPS: "400"
          CUSTOMER_DATA_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/commerce-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/commerce-server.log' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          node --test tests/staff-api.integration.mjs
